<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Intake Demo</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1d1f23; }
    main { max-width: 620px; margin: 40px auto; padding: 28px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.lead { margin: 0 0 22px; color: #5b616e; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; border: 1px solid #c9ced8; border-radius: 6px; }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button { font: inherit; padding: 11px 18px; border-radius: 6px; border: 0; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; flex: 1; }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: #e7eaf0; color: #1d1f23; }
    #message { margin-top: 16px; font-size: 14px; }
    #message.error { color: #b42318; }
    #message.ok { color: #067647; }
    #message ul { margin: 0; padding-left: 20px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } main { margin: 16px; padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>Patient Intake Form</h1>
    <p class="lead">Fill in the details and generate a formatted Word document. Demo only: use sample data.</p>

    <form id="intake" novalidate>
      <label for="patientName">Patient Name *</label>
      <input id="patientName" name="patientName" autocomplete="name">

      <div class="row">
        <div>
          <label for="dateOfBirth">Date of Birth *</label>
          <input id="dateOfBirth" name="dateOfBirth" type="date">
        </div>
        <div>
          <label for="phone">Phone Number *</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
      </div>

      <label for="address">Address *</label>
      <input id="address" name="address" autocomplete="street-address">

      <label for="emergencyContact">Emergency Contact *</label>
      <input id="emergencyContact" name="emergencyContact" placeholder="Name, relationship, phone">

      <label for="insuranceProvider">Insurance Provider</label>
      <input id="insuranceProvider" name="insuranceProvider">

      <label for="reasonForVisit">Reason for Visit *</label>
      <textarea id="reasonForVisit" name="reasonForVisit"></textarea>

      <div class="actions">
        <button type="button" class="secondary" id="fillSample">Fill sample data</button>
        <button type="button" class="primary" data-format="docx">Download Word (.docx)</button>
        <button type="button" class="primary" data-format="pdf">Download PDF</button>
      </div>
      <div id="message" role="alert"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('intake');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    const SAMPLE = {
      patientName: 'Jane Example',
      dateOfBirth: '1988-04-17',
      address: '123 Sample Street, Springfield, IL 62701',
      phone: '+1 (555) 010-2030',
      emergencyContact: 'John Example (spouse), +1 (555) 010-2031',
      insuranceProvider: 'Demo Health Plan',
      reasonForVisit: 'Annual check-up and blood pressure review.',
    };

    function showMessage(type, content) {
      message.className = type;
      message.innerHTML = content;
    }

    function showErrors(errors) {
      showMessage('error', '<ul>' + errors.map(e => '<li>' + e + '</li>').join('') + '</ul>');
    }

    document.getElementById('fillSample').addEventListener('click', () => {
      for (const [key, value] of Object.entries(SAMPLE)) {
        form.elements[key].value = value;
      }
      showMessage('', '');
    });

    async function generate(format, button) {
      showMessage('', '');
      const label = button.textContent;
      const buttons = document.querySelectorAll('button[data-format]');
      buttons.forEach(b => b.disabled = true);
      button.textContent = 'Generating...';

      try {
        const payload = Object.fromEntries(new FormData(form).entries());
        const res = await fetch('/api/generate/' + format, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showErrors(body.errors || ['Something went wrong. Please try again.']);
          return;
        }

        const disposition = res.headers.get('Content-Disposition') || '';
        const fileName = (disposition.match(/filename="(.+?)"/) || [])[1] || 'patient-intake.' + format;
        const url = URL.createObjectURL(await res.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        showMessage('ok', 'Done. ' + fileName + ' should start downloading.');
      } catch (err) {
        showErrors(['Network error. Is the server running?']);
      } finally {
        buttons.forEach(b => b.disabled = false);
        button.textContent = label;
      }
    }

    document.querySelectorAll('button[data-format]').forEach(button => {
      button.addEventListener('click', () => {
        if (!form.reportValidity()) return;
        generate(button.dataset.format, button);
      });
    });
  </script>
</body>
</html>
